# This workflow will do a clean install of node dependencies,
# build the application and deploy it to production
# when a new version (git tag) is released

name: Build & Deploy

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup pnpm and Node.js, install dependencies
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node@26
    - name: Lint, type check and test
      run: |
        pnpm lint --deny-warnings
        pnpm typecheck
        pnpm test --run
    - name: Build app
      run: pnpm build
    - name: Push Build files to production
      uses: burnett01/rsync-deployments@c8300118e5f66a3fe187f35763d7e65848ae205a # 9.0.3
      with:
        switches: -avzr --delete --exclude=config.php
        path: dist/
        remote_path: ${{ secrets.DEPLOY_PATH }}
        remote_host: ${{ secrets.DEPLOY_HOST }}
        remote_port: ${{ secrets.DEPLOY_PORT }}
        remote_user: ${{ secrets.DEPLOY_USER }}
        remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
        remote_key_pass: ${{ secrets.DEPLOY_SSH_PHRASE }}
