name: validate

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  validate:
    # Pull requests from this repo are already validated by the push event, only run for forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm and Node.js, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26
          cache: true

      - name: Lint JS
        run: |
          pnpm lint --deny-warnings

      - name: Type check
        run: |
          pnpm typecheck

      - name: Build frontend
        run: |
          pnpm build

      - name: Test with vitest
        run: |
          pnpm test --run
