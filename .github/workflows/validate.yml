name: validate

concurrency:
  group: validate
  cancel-in-progress: true

on:
  push:
    branches:
      - '**'
      - '!main'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node.js, install dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true

      - name: Lint JS
        run: |
          pnpm lint --deny-warnings

      - name: Build frontend
        run: |
          pnpm build

      - name: Test with vitest
        run: |
          pnpm test --run
